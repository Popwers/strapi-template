name: CI

# Pull requests only: main re-ran the suites the PR had just passed. Client repos generated from this template do the same.
on:
    pull_request:
        # Docs-only PRs skip CI: nothing they touch is built or tested. Re-include any markdown the build reads.
        paths:
            - '**'
            - '!**/*.md'
            - '!docs/**'
            - '!LICENSE'

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    # One job: check and unit each spent more time on setup than on work, and every job bills a whole minute.
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-deps
            - run: vp check
            - run: vp test run
              if: ${{ !cancelled() }}

    # Decides whether the e2e suite has anything to prove. The filter reads the whole PR diff, not the last commit.
    changes:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
        outputs:
            e2e: ${{ steps.filter.outputs.e2e }}
        steps:
            - uses: dorny/paths-filter@v4
              id: filter
              with:
                  # Everything `serve.sh` builds or serves, the suite itself, and what installs or runs it.
                  filters: |
                      e2e:
                          - 'tests/e2e/**'

    e2e-suite:
        needs: changes
        if: ${{ needs.changes.outputs.e2e == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-deps
            # Restore only: the browsers are saved by ci-cache.yml on the default branch.
            - uses: ./.github/actions/e2e-browsers
            # Deterministic tests only: `agent`-tagged tests need a model login CI does not have.
            - run: vp run test:e2e:ci
            - name: Upload e2e report, junit, artifacts and logs
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-report
                  path: |
                      .e2e/report.json
                      .e2e/junit.xml
                      .e2e/artifacts/
                      .e2e/logs/
                  include-hidden-files: true
                  if-no-files-found: warn
                  retention-days: 14

    # Keeps the `e2e` check name: green when the suite passed or had nothing to run, red otherwise.
    e2e:
        needs: [changes, e2e-suite]
        if: ${{ always() }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check the e2e outcome
              env:
                  CHANGES: ${{ needs.changes.result }}
                  WANTED: ${{ needs.changes.outputs.e2e }}
                  SUITE: ${{ needs.e2e-suite.result }}
              run: |
                  echo "changes=$CHANGES e2e-wanted=$WANTED e2e-suite=$SUITE"
                  if [ "$CHANGES" != success ]; then exit 1; fi
                  if [ "$SUITE" = success ]; then exit 0; fi
                  if [ "$SUITE" = skipped ] && [ "$WANTED" != true ]; then exit 0; fi
                  exit 1
