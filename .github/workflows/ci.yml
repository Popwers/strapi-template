name: CI

# Pull requests only: main re-ran the suites the PR had just passed. Client repos generated from this template do the same.
on:
    pull_request:
        # Docs-only PRs skip CI: nothing they touch is built or tested. Re-include any markdown the build reads.
        paths:
            - '**'
            - '!**/*.md'
            - '!docs/**'
            - '!LICENSE'

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    # One job: check and unit each spent more time on setup than on work, and every job bills a whole minute.
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-deps
            - run: vp check
            - run: vp test run
              if: ${{ !cancelled() }}

    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-deps
            # Restore only: the browsers are saved by ci-cache.yml on the default branch.
            - name: Restore Playwright browsers
              uses: actions/cache/restore@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
            - name: Install Chromium and its system dependencies
              run: node_modules/.bin/playwright install --with-deps chromium
            - run: vp run e2e
            - name: Upload Playwright report and traces
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: |
                      tests/e2e/playwright-report/
                      tests/e2e/test-results/
                  retention-days: 14
