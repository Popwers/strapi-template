name: CI

# Pull requests only: main re-ran the suites the PR had just passed. Client repos generated from this template do the same.
on:
    pull_request:
        # Docs-only PRs skip CI: nothing they touch is built or tested. Re-include any markdown the build reads.
        paths:
            - '**'
            - '!**/*.md'
            - '!docs/**'
            - '!LICENSE'

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    # One job: check and unit each spent more time on setup than on work, and every job bills a whole minute.
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-deps
            - run: vp check
            - run: vp test run
              if: ${{ !cancelled() }}

    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-deps
            # Restore only: the browsers are saved by ci-cache.yml on the default branch.
            - name: Restore Playwright browsers
              uses: actions/cache/restore@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
            - name: Install Chromium and its system dependencies
              run: vpx e2e-web install chromium --with-deps
            # Deterministic tests only: `agent`-tagged tests need a model login CI does not have.
            - run: vp run test:e2e:ci
            - name: Upload e2e report, junit, artifacts and logs
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-report
                  path: |
                      .e2e/report.json
                      .e2e/junit.xml
                      .e2e/artifacts/
                      .e2e/logs/
                  if-no-files-found: warn
                  retention-days: 14
