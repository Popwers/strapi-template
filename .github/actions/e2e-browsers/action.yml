name: Setup e2e browsers
description: Restore the Chromium cache keyed on the installed playwright-core, then install Chromium. Shared by ci.yml and ci-cache.yml so both use the same key.

inputs:
    save:
        description: "'true' writes the cache (ci-cache.yml on the default branch). Pull requests only restore."
        default: 'false'

runs:
    using: composite
    steps:
        # The browser build follows playwright-core, not the lockfile: unrelated dependency bumps keep the cache.
        - name: Resolve playwright-core version
          id: playwright
          shell: bash
          run: echo "version=$(npm ls playwright-core --json --depth=1 | node -p 'JSON.parse(require("fs").readFileSync(0)).dependencies["@e2e-dev/web"].dependencies["playwright-core"].version')" >> "$GITHUB_OUTPUT"
        - name: Restore e2e browsers
          id: browsers
          uses: actions/cache/restore@v6
          with:
              path: ~/.cache/ms-playwright
              key: e2e-browsers-${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}
        # The system libraries are not cached: `--with-deps` installs them on every pull request run.
        - name: Install Chromium
          shell: bash
          run: vpx e2e-web install chromium ${{ inputs.save != 'true' && '--with-deps' || '' }}
        - name: Save e2e browsers
          if: ${{ inputs.save == 'true' && steps.browsers.outputs.cache-hit != 'true' }}
          uses: actions/cache/save@v6
          with:
              path: ~/.cache/ms-playwright
              key: e2e-browsers-${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}
