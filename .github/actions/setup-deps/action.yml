name: Setup Vite+ and dependencies
description: Install Vite+, restore the dependency caches and install only on a cache miss. Shared by ci.yml and ci-cache.yml so both use the same keys.

inputs:
    save:
        description: "'true' writes the caches (ci-cache.yml on the default branch). Pull requests only restore, since a PR cache is invisible to every other PR."
        default: 'false'

runs:
    using: composite
    steps:
        - uses: voidzero-dev/setup-vp@v1.21.1
          with:
              cache: true
              cache-save: ${{ inputs.save }}
              # Installed below, only when node_modules missed.
              run-install: false
        - name: Resolve Node version
          id: node
          shell: bash
          run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"
        # Exact key only, no restore-keys: a partial node_modules is worse than none.
        - name: Restore node_modules
          id: modules
          if: ${{ inputs.save != 'true' }}
          uses: actions/cache/restore@v6
          with:
              path: node_modules
              key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.version }}-${{ hashFiles('package-lock.json') }}
        - name: Install dependencies
          if: ${{ inputs.save == 'true' || steps.modules.outputs.cache-hit != 'true' }}
          shell: bash
          run: vp install
        - name: Save node_modules
          if: ${{ inputs.save == 'true' }}
          uses: actions/cache/save@v6
          with:
              path: node_modules
              key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.version }}-${{ hashFiles('package-lock.json') }}
